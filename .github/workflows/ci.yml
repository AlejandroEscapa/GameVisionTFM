name: CI

on:
  push:
    branches: [ master, ui-redesign-2026 ]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Build + tests unitarios (JVM)
  # ---------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json está fuera del repo (gitignored): en CI se genera
      # uno dummy con el mismo package name para que el plugin de Google Services
      # pueda compilar. No contiene credenciales reales.
      - name: Dummy google-services.json (CI)
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-dummy",
              "firebase_url": "https://ci-dummy.firebaseio.com",
              "storage_bucket": "ci-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "es.androidtfm.gamevision" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCI-DUMMY-DUMMY-DUMMY-DUMMY-DUM" } ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Permisos de ejecución del wrapper
        run: chmod +x gradlew

      - name: Tests unitarios + build debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  # ---------------------------------------------------------------------------
  # Job 2 — Tests de reglas de Firestore (Emulator Suite)
  # ---------------------------------------------------------------------------
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (requerido por firebase-tools/emulador)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de los tests de reglas
        working-directory: firebase-tests
        run: npm ci || npm install

      - name: Ejecutar tests de reglas (Emulator Suite)
        working-directory: firebase-tests
        run: npm test
